name: Build installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build onefile executable
        run: pyinstaller packaging/windows/AVKtimer.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\avk.iss'

      - name: Build Vigia de Slides onefile executable
        run: pyinstaller packaging/windows/VigiaSlides.spec

      - name: Build Vigia de Slides installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\vigia.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: AVKtimer-windows-installer
          path: Output/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build .app and .dmg
        run: bash packaging/macos/build_mac.sh "${GITHUB_REF_NAME#v}"

      - name: Build Vigia de Slides .app and .dmg
        run: bash packaging/macos/build_mac_vigia.sh "1.0.1"

      - uses: actions/upload-artifact@v4
        with:
          name: AVKtimer-macos-dmg
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release with both installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/AVKtimer-windows-installer/*.exe
            artifacts/AVKtimer-macos-dmg/*.dmg
