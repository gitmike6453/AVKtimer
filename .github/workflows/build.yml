name: Build installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build onefile executable
        run: pyinstaller packaging/windows/AVKtimer.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\avk.iss'

      - name: Build Vigia de Slides onefile executable
        run: pyinstaller packaging/windows/VigiaSlides.spec

      - name: Build Vigia de Slides installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\vigia.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: AVKtimer-windows-installer
          path: Output/*.exe

  macos:
    # Fixado em macos-13 (runner Intel) de propósito: "macos-latest" passou a apontar
    # para runners Apple Silicon (arm64), e o PyInstaller compila só para a arquitetura
    # nativa da máquina onde corre -- um build feito em arm64 não arranca em Mac Intel.
    # Um binário Intel corre nativamente em Mac Intel E via Rosetta 2 em Apple Silicon
    # (M1 a M4), dando um único .dmg universal sem a fragilidade de tentar compilar
    # universal2 (exigiria wheels universal2 para todas as dependências, nem sempre
    # disponíveis). Se a Apple deixar de suportar Rosetta ou o runner macos-13 for
    # descontinuado, terá de se passar para um build universal2 real ou publicar dois
    # .dmg separados (Intel + Apple Silicon).
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build .app and .dmg
        run: bash packaging/macos/build_mac.sh "${GITHUB_REF_NAME#v}"

      - name: Build Vigia de Slides .app and .dmg
        run: bash packaging/macos/build_mac_vigia.sh "1.0.1"

      - uses: actions/upload-artifact@v4
        with:
          name: AVKtimer-macos-dmg
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release with both installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/AVKtimer-windows-installer/*.exe
            artifacts/AVKtimer-macos-dmg/*.dmg
